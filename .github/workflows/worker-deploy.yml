name: Deploy Sierra Command Worker
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/worker-deploy.yml'
  workflow_dispatch: {}
jobs:
  migrate_and_deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply D1 schema (idempotent — safe to re-run)
        run: npx wrangler d1 execute sierra-command-db --remote --file=./schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # `CREATE TABLE IF NOT EXISTS` in schema.sql is a no-op against a table
      # that already exists remotely — it does NOT retrofit new columns or
      # constraint changes onto it. Every column/CHECK added to an
      # already-live table needs an explicit, idempotent migration here too
      # (probe with a cheap SELECT/ALTER attempt, tolerate the "already
      # applied" failure, only run the real migration when the probe shows
      # it's actually missing). This is how `trades`/`signals.exit_mode` and
      # `trades.source`'s widened CHECK constraint (added on top of tables
      # that already existed on the remote D1) actually reach production.
      - name: Migrate existing table columns (idempotent)
        run: |
          set -e

          echo "Probing signals.exit_mode..."
          set +e
          npx wrangler d1 execute sierra-command-db --remote --command "SELECT exit_mode FROM signals LIMIT 1" >/tmp/probe_signals.log 2>&1
          SIGNALS_PROBE=$?
          set -e
          if [ $SIGNALS_PROBE -ne 0 ]; then
            echo "signals.exit_mode missing — adding it."
            npx wrangler d1 execute sierra-command-db --remote --command "ALTER TABLE signals ADD COLUMN exit_mode TEXT NOT NULL DEFAULT 'fixed' CHECK (exit_mode IN ('fixed','trailing'))"
          else
            echo "signals.exit_mode already present — skipping."
          fi

          echo "Probing trades.exit_mode..."
          set +e
          npx wrangler d1 execute sierra-command-db --remote --command "SELECT exit_mode FROM trades LIMIT 1" >/tmp/probe_trades.log 2>&1
          TRADES_PROBE=$?
          set -e
          if [ $TRADES_PROBE -ne 0 ]; then
            echo "trades.exit_mode missing — rebuilding trades with the new column and the widened source CHECK (SQLite can't ALTER a CHECK constraint in place)."
            # activity_log.related_trade_id REFERENCES trades(id): dropping
            # trades while that FK is enforced fails even though the rebuilt
            # table gets the exact same row ids back a moment later.
            # `PRAGMA foreign_keys = OFF` does NOT work here — D1's remote
            # HTTP API does not honor it (confirmed: the DROP TABLE still
            # failed with the same FOREIGN KEY constraint error even with
            # that pragma set first). Instead: park the referencing values
            # in a backup table, null them out so nothing points at
            # `trades`, do the rebuild, then restore them from the backup —
            # the FK is never violated because nothing references trades
            # while it's dropped.
            npx wrangler d1 execute sierra-command-db --remote --command "
              CREATE TABLE IF NOT EXISTS activity_log_trade_fk_backup AS
                SELECT id, related_trade_id FROM activity_log WHERE related_trade_id IS NOT NULL;
              UPDATE activity_log SET related_trade_id = NULL WHERE related_trade_id IS NOT NULL;
              CREATE TABLE IF NOT EXISTS trades_migrated (
                id TEXT PRIMARY KEY,
                signal_id TEXT REFERENCES signals(id),
                symbol TEXT NOT NULL,
                direction TEXT NOT NULL CHECK (direction IN ('long','short')),
                entry REAL NOT NULL,
                sl REAL,
                tp REAL,
                volume REAL NOT NULL,
                source TEXT NOT NULL CHECK (source IN ('binance_testnet','binance_live','oanda_demo','oanda_live','oanda_demo_simulated')),
                status TEXT NOT NULL DEFAULT 'open' CHECK (status IN ('open','closed')),
                pnl REAL,
                exit_mode TEXT NOT NULL DEFAULT 'fixed' CHECK (exit_mode IN ('fixed','trailing')),
                opened_at TEXT NOT NULL DEFAULT (datetime('now')),
                closed_at TEXT
              );
              INSERT INTO trades_migrated (id, signal_id, symbol, direction, entry, sl, tp, volume, source, status, pnl, exit_mode, opened_at, closed_at)
                SELECT id, signal_id, symbol, direction, entry, sl, tp, volume, source, status, pnl, 'fixed', opened_at, closed_at FROM trades;
              DROP TABLE trades;
              ALTER TABLE trades_migrated RENAME TO trades;
              CREATE INDEX IF NOT EXISTS idx_trades_symbol ON trades(symbol);
              CREATE INDEX IF NOT EXISTS idx_trades_status ON trades(status);
              CREATE INDEX IF NOT EXISTS idx_trades_source ON trades(source);
              CREATE INDEX IF NOT EXISTS idx_trades_signal_id ON trades(signal_id);
              CREATE INDEX IF NOT EXISTS idx_trades_opened_at ON trades(opened_at);
              UPDATE activity_log SET related_trade_id = (
                SELECT related_trade_id FROM activity_log_trade_fk_backup WHERE activity_log_trade_fk_backup.id = activity_log.id
              ) WHERE id IN (SELECT id FROM activity_log_trade_fk_backup);
              DROP TABLE activity_log_trade_fk_backup;
            "
          else
            echo "trades.exit_mode already present — skipping."
          fi

          echo "Probing strategy_settings.params_json..."
          set +e
          npx wrangler d1 execute sierra-command-db --remote --command "SELECT params_json FROM strategy_settings LIMIT 1" >/tmp/probe_settings.log 2>&1
          SETTINGS_PROBE=$?
          set -e
          if [ $SETTINGS_PROBE -ne 0 ]; then
            echo "strategy_settings.params_json missing — adding it."
            npx wrangler d1 execute sierra-command-db --remote --command "ALTER TABLE strategy_settings ADD COLUMN params_json TEXT NOT NULL DEFAULT '{}'"
          else
            echo "strategy_settings.params_json already present — skipping."
          fi

          echo "Probing backtest_runs.win_rate..."
          set +e
          npx wrangler d1 execute sierra-command-db --remote --command "SELECT win_rate FROM backtest_runs LIMIT 1" >/tmp/probe_backtest.log 2>&1
          BACKTEST_PROBE=$?
          set -e
          if [ $BACKTEST_PROBE -ne 0 ]; then
            echo "backtest_runs.win_rate/trade_count missing — adding them (plain ADD COLUMN, nothing references backtest_runs so no rebuild needed)."
            npx wrangler d1 execute sierra-command-db --remote --command "
              ALTER TABLE backtest_runs ADD COLUMN win_rate REAL;
              ALTER TABLE backtest_runs ADD COLUMN trade_count INTEGER;
            "
          else
            echo "backtest_runs.win_rate already present — skipping."
          fi

          echo "Probing trades.timeframe..."
          set +e
          npx wrangler d1 execute sierra-command-db --remote --command "SELECT timeframe FROM trades LIMIT 1" >/tmp/probe_trades_timeframe.log 2>&1
          TRADES_TIMEFRAME_PROBE=$?
          set -e
          if [ $TRADES_TIMEFRAME_PROBE -ne 0 ]; then
            echo "trades.timeframe missing — adding it (plain ADD COLUMN, nullable, no rebuild needed)."
            npx wrangler d1 execute sierra-command-db --remote --command "ALTER TABLE trades ADD COLUMN timeframe TEXT"
          else
            echo "trades.timeframe already present — skipping."
          fi

          echo "Probing backtest_trades.timeframe..."
          set +e
          npx wrangler d1 execute sierra-command-db --remote --command "SELECT timeframe FROM backtest_trades LIMIT 1" >/tmp/probe_backtest_trades_timeframe.log 2>&1
          BACKTEST_TRADES_TIMEFRAME_PROBE=$?
          set -e
          if [ $BACKTEST_TRADES_TIMEFRAME_PROBE -ne 0 ]; then
            echo "backtest_trades.timeframe missing — adding it (plain ADD COLUMN, nullable, no rebuild needed)."
            npx wrangler d1 execute sierra-command-db --remote --command "ALTER TABLE backtest_trades ADD COLUMN timeframe TEXT"
          else
            echo "backtest_trades.timeframe already present — skipping."
          fi

          echo "Probing activity_log.user_agent..."
          set +e
          npx wrangler d1 execute sierra-command-db --remote --command "SELECT user_agent FROM activity_log LIMIT 1" >/tmp/probe_activity_log_ua.log 2>&1
          ACTIVITY_LOG_UA_PROBE=$?
          set -e
          if [ $ACTIVITY_LOG_UA_PROBE -ne 0 ]; then
            echo "activity_log.user_agent/source_ip missing — adding them (plain ADD COLUMN, nullable, no rebuild needed)."
            npx wrangler d1 execute sierra-command-db --remote --command "
              ALTER TABLE activity_log ADD COLUMN user_agent TEXT;
              ALTER TABLE activity_log ADD COLUMN source_ip TEXT;
            "
          else
            echo "activity_log.user_agent already present — skipping."
          fi

          echo "Probing trades.factor_state..."
          set +e
          npx wrangler d1 execute sierra-command-db --remote --command "SELECT factor_state FROM trades LIMIT 1" >/tmp/probe_trades_factor_state.log 2>&1
          TRADES_FACTOR_STATE_PROBE=$?
          set -e
          if [ $TRADES_FACTOR_STATE_PROBE -ne 0 ]; then
            echo "trades.factor_state/position_group_id missing — adding them (plain ADD COLUMN, nullable, no rebuild needed)."
            npx wrangler d1 execute sierra-command-db --remote --command "
              ALTER TABLE trades ADD COLUMN factor_state TEXT;
              ALTER TABLE trades ADD COLUMN position_group_id TEXT;
              CREATE INDEX IF NOT EXISTS idx_trades_position_group_id ON trades(position_group_id);
            "
          else
            echo "trades.factor_state already present — skipping."
          fi

          echo "Probing backtest_session_breakdown.session CHECK constraint..."
          # SQLite can't ALTER a CHECK constraint in place, so a plain
          # column-presence probe (as used above) doesn't apply here — the
          # column itself hasn't changed, only the set of values its CHECK
          # accepts. Instead, text-search the table's own stored CREATE
          # TABLE statement (sqlite_master.sql) for the new session value —
          # present means already migrated, absent means still on the old
          # 4-value CHECK. This table is a pure derived aggregate cache (see
          # schema.sql's comment) with nothing referencing it via FK, so a
          # plain drop+recreate is enough — no backup/restore dance like the
          # trades.exit_mode rebuild above. Existing rows are in the old,
          # now-incompatible 4-bucket shape and are intentionally not
          # migrated; they repopulate the next time each strategy is
          # backtested.
          npx wrangler d1 execute sierra-command-db --remote --command "SELECT sql FROM sqlite_master WHERE type='table' AND name='backtest_session_breakdown'" > /tmp/probe_session_breakdown.log 2>&1
          if ! grep -q "london_ny_overlap" /tmp/probe_session_breakdown.log; then
            echo "backtest_session_breakdown still on the old session CHECK — dropping and recreating."
            npx wrangler d1 execute sierra-command-db --remote --command "
              DROP TABLE IF EXISTS backtest_session_breakdown;
              CREATE TABLE backtest_session_breakdown (
                backtest_run_id TEXT NOT NULL REFERENCES backtest_runs(id),
                session TEXT NOT NULL CHECK (session IN ('asia','london','new_york','london_ny_overlap','asia_london_overlap','outside')),
                trade_count INTEGER NOT NULL DEFAULT 0,
                win_rate REAL,
                net_pnl REAL NOT NULL DEFAULT 0,
                PRIMARY KEY (backtest_run_id, session)
              );
              CREATE INDEX IF NOT EXISTS idx_backtest_session_breakdown_run_id ON backtest_session_breakdown(backtest_run_id);
            "
          else
            echo "backtest_session_breakdown already on the new session CHECK — skipping."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # ict_sweep_mss/_sl's default logic-threshold overrides — deliberately
      # a separate step from both "Apply D1 schema" (whose seed INSERT can't
      # reference params_json at all — see schema.sql's comment above that
      # INSERT) and the ALTER TABLE step above (which only adds the column,
      # empty). Only touches rows still at the column's own default ('{}') so
      # re-running this on every deploy never clobbers a value someone has
      # since customized via PUT /api/strategy-settings/:id. Mirrors
      # ictSweepMssAdapter.js's DEFAULT_PARAMS exactly — this row exists so
      # the values are visible/editable without reading the adapter source,
      # not because the adapter can't fall back on its own (it does, via
      # `{ ...DEFAULT_PARAMS, ...settings }`, whenever params_json is '{}').
      - name: Set ict_sweep_mss default params_json
        run: |
          npx wrangler d1 execute sierra-command-db --remote --command "
            UPDATE strategy_settings SET params_json =
              '{\"swingLeft\":3,\"swingRight\":3,\"atrLen\":14,\"displacementAtrMult\":1.5,\"displacementBodyRatioMin\":0.6,\"displacementMaxBars\":5,\"mssMaxBars\":10,\"fvgMinAtrMult\":0.2,\"entryMode\":\"ce\",\"slAtrBuffer\":0.1,\"minRR\":1.5,\"fillMaxBars\":20,\"htfBiasFilter\":false,\"htfTimeframeMinutes\":240}'
              WHERE strategy_id IN ('ict_sweep_mss', 'ict_sweep_mss_sl') AND params_json = '{}';
          "
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # sc_keylevel_sweep's default logic-threshold overrides — same
      # rationale/idempotency guard as the ict_sweep_mss step above. Not yet
      # read by any backtest adapter (none is registered — see
      # worker/src/strategies/scKeylevelSweep.js's header), but kept visible/
      # editable via the Settings UI ahead of that, same as every other
      # params_json default in this workflow.
      - name: Set sc_keylevel_sweep default params_json
        run: |
          npx wrangler d1 execute sierra-command-db --remote --command "
            UPDATE strategy_settings SET params_json =
              '{\"SESSION_ASIA\":\"01:00-09:00\",\"SESSION_LONDON\":\"09:00-14:30\",\"SESSION_NEWYORK\":\"14:30-22:00\",\"SESSION_TZ\":\"Europe/Berlin\",\"PIVOT_LEFT\":2,\"PIVOT_RIGHT\":2,\"CHOCH_TIMEOUT_MIN\":120,\"SL_ATR_BUFFER_MULT\":0.1,\"SL_ATR_LEN\":14,\"MIN_RR\":1.0,\"MIN_CONFLUENCE\":1}'
              WHERE strategy_id = 'sc_keylevel_sweep' AND params_json = '{}';
          "
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Re-derives every strategy's logic hash straight from the current
      # backtest/adapters.js source and applies it as one idempotent SQL
      # file — see worker/scripts/generate-logic-invalidation-sql.mjs and
      # schema.sql's strategy_logic_versions comment. Only a strategy whose
      # adapter function actually changed gets its backtest_runs (and their
      # backtest_session_breakdown rows) deleted; strategy_settings (risk,
      # session filter, correlation limit) is a separate table this never
      # reads, so tuning those never triggers this. Runs after the schema/
      # column migrations above (needs strategy_logic_versions to exist).
      - name: Invalidate backtest_runs for strategies whose logic changed
        run: |
          node scripts/generate-logic-invalidation-sql.mjs > /tmp/logic-invalidation.sql
          npx wrangler d1 execute sierra-command-db --remote --file=/tmp/logic-invalidation.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Sync Binance Testnet secrets (skipped until repo secrets exist)
        run: |
          if [ -n "$BINANCE_TESTNET_API_KEY" ]; then
            echo "$BINANCE_TESTNET_API_KEY" | npx wrangler secret put BINANCE_TESTNET_API_KEY
            echo "$BINANCE_TESTNET_API_SECRET" | npx wrangler secret put BINANCE_TESTNET_API_SECRET
          else
            echo "BINANCE_TESTNET_API_KEY not set as a repo secret yet — skipping."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BINANCE_TESTNET_API_KEY: ${{ secrets.BINANCE_TESTNET_API_KEY }}
          BINANCE_TESTNET_API_SECRET: ${{ secrets.BINANCE_TESTNET_API_SECRET }}
      - name: Sync Twelve Data secret (skipped until repo secret exists)
        run: |
          if [ -n "$TWELVE_DATA_API_KEY" ]; then
            echo "$TWELVE_DATA_API_KEY" | npx wrangler secret put TWELVE_DATA_API_KEY
          else
            echo "TWELVE_DATA_API_KEY not set as a repo secret yet — skipping."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      # CoinGecko's fully-anonymous public API blocks Cloudflare Workers'
      # egress IPs (confirmed live: /coingecko/candles and the backtest
      # engine's crypto path both 403 from the deployed Worker while an
      # identical request from a plain non-Workers IP succeeds) — a Demo API
      # key (free, register at coingecko.com/en/api/pricing) routes requests
      # through CoinGecko's authenticated path instead of the anonymous one
      # their anti-abuse IP filtering blocks.
      - name: Sync CoinGecko secret (skipped until repo secret exists)
        run: |
          if [ -n "$COINGECKO_API_KEY" ]; then
            echo "$COINGECKO_API_KEY" | npx wrangler secret put COINGECKO_API_KEY
          else
            echo "COINGECKO_API_KEY not set as a repo secret yet — skipping."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      - name: Deploy worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
