name: Deploy Sierra Command Worker
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/worker-deploy.yml'
jobs:
  migrate_and_deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply D1 schema (idempotent — safe to re-run)
        run: npx wrangler d1 execute sierra-command-db --remote --file=./schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Sync Binance Testnet secrets (skipped until repo secrets exist)
        if: ${{ secrets.BINANCE_TESTNET_API_KEY != '' }}
        run: |
          echo "${{ secrets.BINANCE_TESTNET_API_KEY }}" | npx wrangler secret put BINANCE_TESTNET_API_KEY
          echo "${{ secrets.BINANCE_TESTNET_API_SECRET }}" | npx wrangler secret put BINANCE_TESTNET_API_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
