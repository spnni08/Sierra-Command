name = "sierra-command-worker"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "sierra-command-db"
database_id = "11c3404b-faac-429f-bc48-9bd40ba93531"

[triggers]
# Auto-close open crypto (Binance) trades whose SL/TP has been hit — see
# src/cron/checkOpenTrades.js. Every 2 minutes: tighter than the ~3min
# candle-check cadence WAVESCOUT itself runs on, so a hit is caught within
# roughly one candle-check cycle rather than trailing it by a full interval,
# without polling so often it meaningfully outpaces how often the underlying
# price data actually changes.
crons = ["*/2 * * * *"]

[vars]
ALLOWED_ORIGIN = "https://sierra-command.web.app"
# Base URL of the WAVESCOUT (tradingview-bot) worker that GET /wavescout/price
# proxies GET /api/candle-check/latest from.
WAVESCOUT_API_URL = "https://tradingview-bot.spnn08.workers.dev"

# Secrets (set via `wrangler secret put <NAME>`, never committed here):
#   CREDENTIALS_ENCRYPTION_KEY  - base64 AES-256 key for encrypting api_credentials rows
#   BINANCE_TESTNET_API_KEY / BINANCE_TESTNET_API_SECRET - Binance Futures Testnet credentials
#   OANDA_API_TOKEN / OANDA_ACCOUNT_ID - OANDA practice account credentials
#   TWELVE_DATA_API_KEY - Twelve Data API key (forex + index-proxy candles,
#                          and the OANDA simulation engine's live prices)
#   COINGECKO_API_KEY - optional; CoinGecko's free tier works anonymously
#                        without one, this only raises the rate limit
